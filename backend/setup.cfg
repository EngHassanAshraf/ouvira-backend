[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.local
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

[flake8]
max-line-length = 127
max-complexity = 10
exclude =
    .git,
    __pycache__,
    */migrations/*,
    .venv,
    venv
per-file-ignores =
    # Allow unused imports in __init__ files
    __init__.py: F401

[isort]
profile = black
line_length = 127
skip_glob = */migrations/*
