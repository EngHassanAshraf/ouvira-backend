[build]
builder = "nixpacks"
buildCommand = "pip install -r ../requirements.txt"

# cache bust: 2

[deploy]
startCommand = """
  set -e &&
  cd /app/backend &&
  mkdir -p /app/backend/geoip &&
  if [ -n "$MAXMIND_LICENSE_KEY" ]; then
    TMPFILE=$(mktemp) &&
    curl -Ls --fail "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key=${MAXMIND_LICENSE_KEY}&suffix=tar.gz" -o "$TMPFILE" &&
    file "$TMPFILE" | grep -q "gzip" &&
    tar -xz --strip-components=1 -C /app/backend/geoip --wildcards "*.mmdb" -f "$TMPFILE" &&
    echo "GeoLite2-City downloaded." ||
    echo "WARNING: GeoIP download failed — continuing without it.";
    rm -f "$TMPFILE";
  else
    echo "MAXMIND_LICENSE_KEY not set — skipping GeoIP download.";
  fi &&
  python manage.py migrate_schemas --shared &&
  gunicorn config.wsgi:application --config gunicorn.conf.py
"""
healthcheckPath = "/health/"
