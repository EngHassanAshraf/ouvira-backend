services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
    container_name: ouvira_backend
    entrypoint: /usr/local/bin/entrypoint.sh
    command: python manage.py runserver 0.0.0.0:8000
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DEBUG: "True"
      RUN_MIGRATIONS: "true"
      GEOIP_PATH: "/var/opt/geoip/GeoLite2-City.mmdb"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
    container_name: ouvira_celery_worker
    command: celery -A config worker --loglevel=info --queues=default,fast
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend:/app
    environment:
      RUN_MIGRATIONS: "false"
      GEOIP_PATH: "/var/opt/geoip/GeoLite2-City.mmdb"
    env_file:
      - .env
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
    container_name: ouvira_celery_beat
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend:/app
    environment:
      RUN_MIGRATIONS: "false"
      GEOIP_PATH: "/var/opt/geoip/GeoLite2-City.mmdb"
    env_file:
      - .env
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: ouvira_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  redis:
    image: redis:alpine
    container_name: ouvira_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
